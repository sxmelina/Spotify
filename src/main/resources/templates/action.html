<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${album != null} ? ${album.naziv} + ' - Spotify' : 'Album - Spotify'">Album - Spotify</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFB6D9 0%, #FFC9E3 50%, #FFE5F1 100%);
            min-height: 100vh; padding: 40px 20px;
        }
        .container {
            max-width: 1000px; margin: 0 auto; background: #fff; border-radius: 25px; padding: 40px;
            box-shadow: 0 15px 50px rgba(255,105,180,0.3);
        }
        .header { text-align:center; margin-bottom: 30px; }
        .logo { color:#FF69B4; font-size:3.2em; font-weight:700; letter-spacing:-2px; text-shadow:2px 2px 4px rgba(255,105,180,.2); }
        h1 { color:#FF1493; font-size:2.2em; margin-top:8px; }
        .subtitle { color:#FF69B4; margin-top:6px; }

        .nav { text-align:center; margin: 30px 0; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
        .btn {
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            color:#fff; padding:12px 26px; text-decoration:none; border-radius:30px; font-weight:700; border:none; cursor:pointer;
            box-shadow: 0 4px 15px rgba(255,105,180,.4); transition: all .3s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255,105,180,.6); }

        .panel {
            display:grid; grid-template-columns: 260px 1fr; gap: 24px; align-items:start;
        }
        .cover {
            width:100%; height:260px; object-fit:cover; border-radius:20px; box-shadow:0 6px 20px rgba(0,0,0,.1);
            border:2px solid #FFB6D9;
        }
        .meta { display:flex; flex-direction:column; gap:10px; }
        .row { color:#C71585; }
        .row b { color:#FF1493; }

        .songs { margin-top: 26px; }
        .songs h2 { color:#FF1493; margin-bottom:10px; }
        .song {
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E9 100%);
            border:2px solid #FFB6D9; border-radius:14px; padding:10px 14px; margin-bottom:8px;
            box-shadow:0 3px 12px rgba(255,105,180,.18);
            display:flex; justify-content:space-between; align-items:center;
        }
        .actions { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top: 18px; }
        .action-link {
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%); color:#fff; text-align:center;
            padding:10px 20px; border-radius:20px; font-weight:700; text-decoration:none;
            box-shadow:0 3px 10px rgba(255,105,180,.3); transition: all .3s;
        }
        .action-link:hover { transform: scale(1.05); box-shadow:0 5px 15px rgba(255,105,180,.5); }

        .like-btn {
            background: linear-gradient(135deg, #FFA0CC 0%, #FF69B4 100%);
            color:#fff; padding:10px 20px; border:none; border-radius:20px; font-weight:700; cursor:pointer;
            box-shadow:0 3px 10px rgba(255,105,180,.35); transition: all .3s; width:100%;
        }
        .like-btn:hover { transform: scale(1.03); box-shadow:0 5px 15px rgba(255,105,180,.55); }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">Spotify</div>
        <h1 th:text="${album != null} ? ${album.naziv} : 'Album'">Album</h1>
        <p class="subtitle">Detalji albuma i lista pjesama</p>
    </div>

    <div class="nav">
        <a class="btn" href="/albumi">← Nazad na listu albuma</a>
        <a class="btn" href="/korisnici">Korisnici</a>
        <a class="btn" href="/korisnici/new">+ Novi korisnik</a>
    </div>

    <div th:if="${album != null}" class="panel">
        <img th:src="${album.slika}" th:alt="${album.naziv}" class="cover">
        <div class="meta">
            <div class="row"><b>Izvođač:</b> <span th:text="${album.izvodjac}"></span></div>
            <div class="row"><b>Žanr:</b> <span th:text="${album.zanr}"></span></div>
            <div class="row"><b>Godina:</b> <span th:text="${album.godinaIzdanja}"></span></div>

            <div class="actions">
                <!-- Link za pjesme: ako koristiš posebnu rutu /a/action/{id}, ostaje ovako -->
                <a class="action-link" th:href="@{/a/action/{id}(id=${album.id})}">Prikaži pjesme</a>

                <!-- Like forma (Many-to-Many Korisnik ↔ Album) -->
                <form th:action="@{|/album/${album.id}/like|}" method="post">
                    <input type="hidden" name="userId" value="1"/>
                    <button type="submit" class="like-btn">♡ Like</button>
                </form>
            </div>

            <div class="songs">
                <h2>Pjesme</h2>
                <div th:each="p : ${pjesme}" class="song">
                    <span th:text="${p.naziv}">Naziv</span>
                    <small th:text="${p.trajanje}">3:30</small>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${album == null}">
        <p style="color:#C71585">Album nije pronađen.</p>
    </div>
</div>
</body>
</html>
