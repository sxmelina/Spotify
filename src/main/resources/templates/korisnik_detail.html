<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalji korisnika - Spotify</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFB6D9 0%, #FFC9E3 50%, #FFE5F1 100%);
            min-height:100vh; padding:40px 20px;
        }
        .container{ max-width:1000px; margin:0 auto; background:#fff; border-radius:25px; padding:40px;
            box-shadow:0 15px 50px rgba(255,105,180,.3);
        }
        .header{ text-align:center; margin-bottom:30px;}
        .logo{ color:#FF69B4; font-size:3.2em; font-weight:700; letter-spacing:-2px; text-shadow:2px 2px 4px rgba(255,105,180,.2); }
        h1{ color:#FF1493; font-size:2.2em; margin-top:8px; }
        .subtitle{ color:#FF69B4; margin-top:6px; }

        .nav{ text-align:center; margin: 30px 0; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
        .btn{
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            color:#fff; padding:12px 26px; text-decoration:none; border-radius:30px; font-weight:700;
            box-shadow:0 4px 15px rgba(255,105,180,.4); transition:.3s; border:none; cursor:pointer;
        }
        .btn:hover{ transform:translateY(-3px); box-shadow:0 6px 20px rgba(255,105,180,.6);}

        .card{
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E9 100%);
            border:2px solid #FFB6D9; border-radius:20px; padding:20px;
            box-shadow:0 4px 15px rgba(255,105,180,.2); margin-bottom:20px;
        }
        .albums-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap:18px; }
        .album-card{
            background:#fff; border:2px solid #FFB6D9; border-radius:16px; padding:14px;
            box-shadow:0 3px 12px rgba(255,105,180,.18);
            display:flex; flex-direction:column; gap:8px;
        }
        .album-title{ color:#FF1493; font-weight:700; }
        .album-artist{ color:#FF69B4; }
        .album-details{ color:#C71585; font-size:.95em; }
        .action-link{
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%); color:#fff; text-align:center;
            padding:10px 18px; border-radius:18px; font-weight:700; text-decoration:none; margin-top:6px;
            box-shadow:0 3px 10px rgba(255,105,180,.3); transition: all .3s;
        }
        .action-link:hover{ transform: scale(1.05); box-shadow:0 5px 15px rgba(255,105,180,.5); }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">Spotify</div>
        <h1 th:text="${korisnik.username}">Korisnik</h1>
        <p class="subtitle">Profil i lajkovani albumi</p>
    </div>

    <div class="nav">
        <a class="btn" href="/korisnici">← Nazad</a>
        <a class="btn" href="/albumi">Albumi</a>
        <a class="btn" th:href="@{|/korisnici/${korisnik.id}/edit|}">Uredi</a>
    </div>

    <div class="card">
        <p><b style="color:#FF1493">Email:</b> <span style="color:#C71585" th:text="${korisnik.email}"></span></p>
    </div>

    <h2 style="color:#FF1493; margin:10px 0 12px;">Lajkovani albumi</h2>
    <div class="albums-grid">
        <div class="album-card" th:each="a : ${korisnik.likedAlbums}">
            <div class="album-title" th:text="${a.naziv}">Naziv</div>
            <div class="album-artist" th:text="${a.izvodjac}">Izvođač</div>
            <div class="album-details">
                <span th:text="${a.zanr}">Žanr</span> • <span th:text="${a.godinaIzdanja}">2020</span>
            </div>
            <a class="action-link" th:href="@{/a/action/{id}(id=${a.id})}">Prikaži pjesme</a>
        </div>
    </div>
</div>
</body>
</html>
