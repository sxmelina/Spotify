<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pjesme - Spotify</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFB6D9 0%, #FFC9E3 50%, #FFE5F1 100%);
            min-height:100vh; padding:40px 20px;
        }
        .container {
            max-width:1100px; margin:0 auto; background:#fff; border-radius:25px; padding:40px;
            box-shadow:0 15px 50px rgba(255,105,180,.3);
        }
        .header { text-align:center; margin-bottom:30px; }
        .logo { color:#FF69B4; font-size:3.2em; font-weight:700; letter-spacing:-2px;
            text-shadow:2px 2px 4px rgba(255,105,180,.2); }
        h1 { color:#FF1493; font-size:2.2em; margin-top:8px; }
        .subtitle { color:#FF69B4; margin-top:6px; }

        .nav { text-align:center; margin: 30px 0; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
        .btn{
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            color:#fff; padding:12px 26px; text-decoration:none; border-radius:30px; font-weight:700;
            box-shadow:0 4px 15px rgba(255,105,180,.4); transition:.3s; border:none; cursor:pointer;
        }
        .btn:hover{ transform:translateY(-3px); box-shadow:0 6px 20px rgba(255,105,180,.6);}

        .song-list { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
        .song {
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E9 100%);
            border-radius:16px; border:2px solid #FFB6D9; padding:10px 16px;
            box-shadow:0 4px 15px rgba(255,105,180,.2);
            display:flex; justify-content:space-between; align-items:center;
        }
        .song-title { color:#FF1493; font-weight:700; }
        .song-meta { color:#C71585; font-size:.9em; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">Spotify</div>
        <h1>Pjesme</h1>
        <p class="subtitle">Lista svih pjesama u bazi</p>
    </div>

    <div class="nav">
        <a class="btn" href="/albumi">← Nazad na albume</a>
        <a class="btn" href="/korisnici">Korisnici</a>
    </div>

    <div class="song-list">
        <div class="song" th:each="p : ${pjesme}">
            <div>
                <div class="song-title" th:text="${p.naziv}">Naziv</div>
                <div class="song-meta">
                    <span th:text="${p.trajanje}">3:15</span>
                    ·
                    <span th:text="${p.godinaIzdanja}">2024</span>
                </div>
            </div>
            <div class="song-meta">
                <span th:text="${p.album != null ? p.album.naziv : 'Bez albuma'}">Album</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
